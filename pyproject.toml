[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Muhammad Ahmed Javed", email = "ahmedjaved.codes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fal-client>=1.0.3",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "invisible-watermark>=0.2.0",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.16.0",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sse-starlette>=3.7.1",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["test-manual"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
