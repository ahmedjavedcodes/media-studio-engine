[project]
name = "media_engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  # agents
  "langgraph", "langgraph-checkpoint-sqlite", "langchain-core",
  "langchain-anthropic", "langchain-openai",
  # providers (OpenRouter via httpx)
  "httpx", "fal-client", "anthropic", "typesafe-sdk", "groq",
  "google-genai", "openai",
  # data & memory
  "pydantic>=2", "pydantic-settings", "pinecone",
  # observability
  "langsmith", "structlog",
  # images
  "pillow", "opencv-python-headless", "numpy", "playwright", "invisible-watermark",
  # reliability
  "tenacity",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "pytest-cov", "respx", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
