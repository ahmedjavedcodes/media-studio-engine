# Per-agent model policy for the image-creation harness.
# `models` maps each plan tier to a gateway chain name (gateway/chains.yaml). The chain, not the
# agent, decides the provider and the fallback order. Each agent's chain starts on a different
# Groq model (gate: fast_llm, prompt_enhancer: reasoning, critic: vision, safety_reviewer:
# safety_review) so they never share Groq's per-model rate limits. Prompt paths are relative to
# media_engine/prompts/.

gate: # intake + input safety (§4.1): one small structured call before ANY spend; fails closed
  prompt: gate/gate.md
  requires: [structured_output]
  reasoning_effort: low
  models: {free: fast_llm, pro: fast_llm, max: fast_llm, ultra: fast_llm}

safety_reviewer: # ONLY when the Gate says `review`. gpt-oss-safeguard-20b: 3 req/min, no fallback
  prompt: gate/safety_review.md
  requires: [structured_output]
  reasoning_effort: low
  models: {free: safety_review, pro: safety_review, max: safety_review, ultra: safety_review}

prompt_enhancer:
  prompt: brief/brief.md
  requires: [structured_output]
  reasoning_effort: low
  # D4: the enhancement runs ONCE per request and every image shares it, so temperature buys
  # no variety (the seeds do that); it only makes the same input give a different prompt each
  # run, which makes changes untestable. 0.2, per IMAGE-CREATE-OPTIMIZE §4.2.
  temperature: 0.2
  params:
    # must_have grounding: keep an item only if at least this fraction of its word stems
    # appear in the user's request (or the item appears in it verbatim).
    grounding_min_fraction: 0.5
    stem_len: 6 # compare words by this many leading letters, after stripping -s/-ed/-ing
    min_word_len: 3 # shorter Latin-script words are ignored (CJK characters always count)
  # reasoning on every plan: its Groq model (gpt-oss-120b) differs from the router's
  # (fast_llm, gpt-oss-20b), and Groq limits are per model, so the two never share a quota.
  models: {free: reasoning, pro: reasoning, max: reasoning, ultra: reasoning}

critic:
  prompt: critic/critic.md
  requires: [vision, structured_output]
  # `none`, not `low`: measured 2026-11-20 on Groq qwen, low spent 58 reasoning tokens on a
  # one-word answer, none spent 0 (and ~1.3K prompt tokens either way). Providers that do not
  # take `none` (Cloudflare, OpenRouter) leave the field out.
  reasoning_effort: none
  params:
    # The Critic reads the STORED thumbnail of this long side (px). 512 until experiment E1
    # picks a size. The fallback re-encodes the original as JPEG at this quality.
    thumbnail_size: 512
    jpeg_quality: 90
    # One more attempt, inside the Critic, when a review ends with no verdict (create is linear:
    # the supervisor never re-runs a step). Not after a block or an unfixable failure.
    retries: 1
    # Groq qwen3.8-27b takes at most 3 images in one request (a 4th is an HTTP 400, measured
    # 2026-11-20). n=4 is reviewed as two groups of 2, run together.
    max_images_per_call: 3
  models: {free: vision, pro: vision, max: vision, ultra: vision}

image_grand_agent: # the supervisor: makes NO LLM call (create is linear, v2.2), so the chain is never used
  requires: []
  models: {free: reasoning, pro: reasoning, max: reasoning, ultra: reasoning}

image_creator: # no LLM: formats a request and calls the image gateway
  requires: [image]
  params:
    # Made ONCE at store time (spec §5.3): one resize serves the Critic, preview and gallery.
    # Which size the Critic should read is experiment E1's question (the Critic reads critic.params.thumbnail_size).
    thumbnail_sizes: [512, 256]
    thumbnail_quality: 85
  models: {free: image_create, pro: image_create, max: image_create, ultra: image_create}

grand_agent: # multi-step planner: a stub for now. Makes no LLM call, so the chain is never used.
  requires: []
  models: {free: reasoning, pro: reasoning, max: reasoning, ultra: reasoning}
