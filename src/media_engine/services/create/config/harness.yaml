# Image-creation harness policy. Every threshold, cap and estimate lives here, not in code.
# Budget and threshold values are build-phase placeholders: product to confirm.

# Below this score the delivery carries the critique as an issue. Information only: create is
# linear (IMAGE-CREATE-OPTIMIZE v2.2) and never regenerates on a low score; the user picks.
quality_threshold: {free: 6, pro: 7, max: 7, ultra: 8}

# A Critic that fails (bad reply, timeout) is asked again about the same images, up to this many
# times per run. It never generates, so it never spends on an image.
max_critic_reasks: 2

# The safety reviewer (gpt-oss-safeguard-20b) is rate limited by Groq to 3 requests/minute and
# has no fallback. A process-level limiter keeps under it: a review waits up to wait_s for a free
# slot, then fails closed with the retryable failure `review_rate_limited` (never an allow).
safety_review: {max_per_period: 3, period_s: 60, wait_s: 5}

# Passed by the Image Creator to providers that support a negative prompt. FLUX (the free
# chain) ignores negative prompts, so the enhancer prompt also avoids describing text at all.
negative_prompt: "text, letters, words, captions, signage with writing, logos, watermark, signature"

max_parallel_branches: 4
max_images_per_request: 4

# Seeds are drawn uniformly from [0, max_seed]. 2^31 - 1: the int32 range providers accept.
max_seed: 2147483647

# Returned image counts as the requested shape when |w/h - requested w/h| <= this. Mismatches
# are reported as an issue only when a PAID provider served the image; on the free path
# (flux-1-schnell is sent no size) they are logged and ignored, by the user's decision.
aspect_ratio_tolerance: 0.02

# While a step runs, the supervisor looks for a cancel (RunStore.load) this often, and aborts the
# in-flight provider calls when one arrives. The backend sets cancel_requested on its store.
cancel_poll_ms: 200

# Per run, on three meters. neurons_total caps image generation on the free path (Cloudflare:
# 10,000 neurons/day shared).
# reserve_fraction is held back from the STEPS (enhance, generate, critique); only a Critic
# re-ask may spend it. A re-ask is checked against the whole remaining budget, so the reserve is
# headroom, not a guarantee. It is 0.10 (was 0.30) because at 0.30 the generate guard refused
# images the plan is meant to give (review round 2, verified by test):
#   free n=2 needs 2 x (60 + 200) = 520 neurons and 2 x 12,000 = 24,000 tokens up front;
#     at 0.30 only 418 / 20,900 were usable (1 image of 2), at 0.10: 540 / 27,000.
#   pro n=4 needs 1,040 neurons / 48,000 tokens; at 0.30 only 41,900 tokens (3 of 4).
# Sizing the reserve as max_critic_reasks x the critique estimate was rejected: on free that is
# 400 neurons / 24,000 tokens, which would leave room for less than ONE image.
# FRAGILE on free: 27,000 - the enhancer's real spend must stay >= 24,000 tokens. The driver is
# the critique estimate (12,000 tokens, sized for a Cloudflare fallback with a repair; a Groq
# qwen review measured ~1,350 prompt tokens). Re-size it under D3, then revisit this.
budgets:
  free: {tokens_total: 30000, cost_cap_usd: 0.0, neurons_total: 600, reserve_fraction: 0.10}
  pro: {tokens_total: 60000, cost_cap_usd: 0.20, neurons_total: 1500, reserve_fraction: 0.10}
  max: {tokens_total: 120000, cost_cap_usd: 0.50, neurons_total: 3000, reserve_fraction: 0.10}
  ultra: {tokens_total: 240000, cost_cap_usd: 1.00, neurons_total: 6000, reserve_fraction: 0.10}

# Per step kind (per image for generate/critique).
#   tokens:            the step's TOTAL token budget (prompt + completion, repair included).
#                      Used for Budget.can_afford and passed down as StoppingCondition.max_tokens.
#   completion_tokens: provider cap on each reply (StoppingCondition.max_completion_tokens).
#                      Must cover gpt-oss reasoning tokens as well as the JSON.
#   neurons:           pre-flight neuron estimate. generate = flux-1-schnell 1024x1024 @ 4 steps
#                      (4 tiles x 4.80 + 4 steps x 9.60 = 57.6), rounded up.
#   critique:          the image makes each call large (~2,500 prompt tokens incl. a 768px image),
#                      and the repair re-sends all of it plus the first reply. 12,000 tokens lets
#                      the repair fit (6,000 never did). Neurons: ~100 per vision call at
#                      llama-4-scout prices (UNVERIFIED: ~24.5k neurons/M in, ~77k/M out), x2 for
#                      a repair. Replace both with measured values after the cf-vision smoke run.
# cost_usd is the WORST REACHABLE chain entry (the paid fallback: image_create ends in
#   openrouter/google/gemini-2.5-flash-image, ~$0.04 per image; a paid LLM fallback call ~$0.001-
#   0.005). It is counted only when ALLOW_PAID is on (otherwise no paid entry can be reached),
#   and then it is checked against the plan's cost_cap_usd BEFORE the call. All UNVERIFIED
#   placeholders. A plan with cost_cap_usd 0 (free) therefore refuses to start when ALLOW_PAID is
#   on: it fails closed rather than risk a dollar the cap does not allow.
step_estimates:
  route: {tokens: 2500, completion_tokens: 600, cost_usd: 0.001, neurons: 5}
  enhance: {tokens: 6000, completion_tokens: 1500, cost_usd: 0.002, neurons: 15}
  generate: {tokens: 0, completion_tokens: 0, cost_usd: 0.04, neurons: 60}
  critique: {tokens: 12000, completion_tokens: 1200, cost_usd: 0.005, neurons: 200}
  supervise: {tokens: 3000, completion_tokens: 800, cost_usd: 0.002, neurons: 10}

deadlines_ms: # wall-clock deadline per step (repair included)
  route: 10000
  enhance: 30000
  generate: 60000
  critique: 40000
  supervise: 15000
