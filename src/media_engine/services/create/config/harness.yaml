# Image-creation harness policy. Every threshold, cap and estimate lives here, not in code.
# Budget and threshold values are build-phase placeholders: product to confirm.

quality_threshold: {free: 6, pro: 7, max: 7, ultra: 8} # retry when quality_score < threshold

max_retries: {free: 1, pro: 2, max: 2, ultra: 2}

levers: # which plans may use each retry lever
  reseed: [free, pro, max, ultra]
  re_enhance: [free, pro, max, ultra]
  switch_model: [pro, max, ultra]
  raise_tier: [max, ultra]

# Passed by the Image Creator to providers that support a negative prompt. FLUX (the free
# chain) ignores negative prompts, so the enhancer prompt also avoids describing text at all.
negative_prompt: "text, letters, words, captions, signage with writing, logos, watermark, signature"

max_parallel_branches: 4
max_images_per_request: 4

# Per run, on three meters. reserve_fraction of each is held back for retries.
# neurons_total caps image generation on the free path (Cloudflare: 10,000 neurons/day shared).
budgets:
  free: {tokens_total: 30000, cost_cap_usd: 0.0, neurons_total: 600, reserve_fraction: 0.30}
  pro: {tokens_total: 60000, cost_cap_usd: 0.20, neurons_total: 1500, reserve_fraction: 0.30}
  max: {tokens_total: 120000, cost_cap_usd: 0.50, neurons_total: 3000, reserve_fraction: 0.30}
  ultra: {tokens_total: 240000, cost_cap_usd: 1.00, neurons_total: 6000, reserve_fraction: 0.30}

# Per step kind (per image for generate/critique).
#   tokens:            the step's TOTAL token budget (prompt + completion, repair included).
#                      Used for Budget.can_afford and passed down as StoppingCondition.max_tokens.
#   completion_tokens: provider cap on each reply (StoppingCondition.max_completion_tokens).
#                      Must cover gpt-oss reasoning tokens as well as the JSON.
#   neurons:           pre-flight neuron estimate. generate = flux-1-schnell 1024x1024 @ 4 steps
#                      (4 tiles x 4.80 + 4 steps x 9.60 = 57.6), rounded up.
step_estimates:
  route: {tokens: 2500, completion_tokens: 600, cost_usd: 0.0, neurons: 5}
  enhance: {tokens: 6000, completion_tokens: 1500, cost_usd: 0.0, neurons: 15}
  generate: {tokens: 0, completion_tokens: 0, cost_usd: 0.0, neurons: 60}
  critique: {tokens: 6000, completion_tokens: 1200, cost_usd: 0.0, neurons: 25}
  supervise: {tokens: 3000, completion_tokens: 800, cost_usd: 0.0, neurons: 10}

deadlines_ms: # wall-clock deadline per step (repair included)
  route: 10000
  enhance: 30000
  generate: 60000
  critique: 40000
  supervise: 15000
