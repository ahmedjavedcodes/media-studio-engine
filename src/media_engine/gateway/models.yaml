    billing_unit: image
    price_measured_usd: 0.035
    supports_seed: false
    n_per_call: 6
    max_input_images: 1
    prompt_style: tags
    prompt_max_words: 30

  - slug: bytedance-seed/seedream-5-0-lite
    name: Seedream 5.0 Lite
