# Model cards (spec section 6). One model, many providers.
#
# `cost` is USD per image at 1K. These are ESTIMATES copied from each provider's pricing page.
# The daily sync (gateway/sync.py) and the billed cost after each call correct them.
# `tier` is computed from the cheapest provider cost. Never write it here.
#
# status: hidden -> testing -> live. A model goes live only after a real test:
# size, seed and the code guard work, and the critic scores a 10-prompt run.
# Verified live on 2026-11-25 (one real Cloudflare run each): flux-1-schnell, flux-2-klein-4b,
# flux-2-klein-9b, phoenix-1. Not yet run: lucid-origin.
# Per-family prompting guides (spec v1.2). The enhancer gets the chosen family's guide at the END
# of its system prompt. `style` is used by COMPILE_MODE=code. 5-8 lines each.
families:
  gpt_image:
    # Source: https://developers.openai.com/api/docs/guides/image-generation and the images API
    # reference (https://developers.openai.com/api/reference/resources/images). OpenAI publishes no
    # separate prompting guide for GPT Image; its examples quote labels in single quotes, start
    # "Generate a photorealistic image of ...", and for edits "describe the change and what to
    # keep". No negative prompt, guidance, steps, style or seed exists on these models.
    label: OpenAI GPT Image
    style: sentences
    max_words: 40
    prompt_guide: |
      Write 2 or 3 vivid sentences. Start with the medium and the subject ("A photorealistic close-up of ...").
      Then the setting, the light, the camera framing and the material textures, in that order.
      Say the shot in words ("a low-angle close-up on a 50mm lens").
      Put any text that must appear in "double quotes" and say where it sits. Say it once, spelled exactly.
      Be literal and concrete: one clear scene, no keyword lists, no negative phrases (describe what IS there).
      Avoid: stacked adjectives, vague mood words, brand or artist names.
  gemini:
    # Source: https://ai.google.dev/gemini-api/docs/image-generation (served at
    # aistudio.google.com/docs/image-generation). Google's template: "A photorealistic [shot type]
    # of [subject] in [setting]. [Light]. Shot from [angle] with [lens]." Describe the scene in
    # rich sentences; ask for what IS there ("an empty street" not "no cars"). No negative prompt,
    # seed, guidance, steps or style parameter exists.
    label: Google Nano Banana & Gemini
    style: sentences
    max_words: 50
    prompt_guide: |
      Write a descriptive paragraph in natural sentences, in this order:
      "A photorealistic [shot type] of [subject] in [setting]. [The light]. Shot from [angle] with [lens]."
      Then add the textures and one sharp-focus detail ("sharp focus on the cap's gold edge").
      Use photographic and camera language to control the composition (close-up, low angle, 85mm, shallow depth of field).
      Say what IS there, never what is not ("an empty street", not "no cars").
      For a product shot name the lighting set-up and keep generous empty space if text will be added later.
      Avoid: keyword lists, tag soup, negative phrases.
  flux:
    # Source: https://docs.bfl.ml/guides/prompting_unified_basics.md, prompting_unified_style.md,
    # prompting_unified_reference.md (FLUX.2 section), usecases_t2i_hex_color_prompting.md. BFL:
    # front-load what matters, "Write in prose, not keyword lists" (klein), quote exact text and
    # say where it goes, keep text short, tie each hex colour to an object, one or two effects at
    # most, no quality filler, no negative prompts. klein has no prompt upsampling: what you write
    # is exactly what the model receives.
    label: FLUX
    style: sentences
    max_words: 60
    prompt_guide: |
      Write flowing prose, not keyword lists. Put the most important thing first.
      Order: subject, setting, style, camera and lens, lighting, colors, then one or two extra effects at most.
      Use real camera words ("85mm lens at f/2, shallow depth of field", "golden hour", "backlit rim light").
      Tie each color to one object ("the cap is deep teal"). Use a hex code only if the user gave one.
      Put any text that must appear in "double quotes", short, and say where it sits.
      Avoid: negative prompts and "no ..." phrases, quality spam like "masterpiece, 8k, highly detailed".
  seedream:
    # Source: https://openrouter.ai/bytedance-seed/seedream-5-0-flash (parameters) and
    # https://seed.bytedance.com/en/seedream5_5 (example prompts). ByteDance publishes no formula:
    # its examples run subject and setting first, then camera and style, in 30 to 70 words; text
    # is quoted with its placement; exclusions are written in prose ("a quiet street with no
    # people"). OpenRouter lists no negative prompt, guidance, steps or watermark for it.
    label: ByteDance Seedream
    style: keywords
    max_words: 60
    prompt_guide: |
      Write one or two clear sentences, subject and setting first, then camera, light and style.
      Name the material textures in plain words (brushed gold, frosted glass, wet stone).
      Works well for products, food and clean commercial scenes. Aim for 30 to 70 words.
      Put any text that must appear in "double quotes" and say where it sits and that it is the only text.
      Write exclusions as a plain fact ("a quiet street with no people"), not as a negative list.
      Avoid: abstract mood words, long stories.
  qwen:
    label: Qwen
    style: keywords
    max_words: 60
    prompt_guide: |
      Write short keyword phrases, subject first, then setting, light and style.
      Put any text that must appear in "double quotes" and say where it sits.
      Good at text in images and posters. Keep the text short.
      Avoid: long sentences, many competing subjects, vague words.
  recraft:
    # Source: https://www.recraft.ai/docs/prompt-engineering-guide/prompting-with-recraft-v4.md.
    # Recraft: structure "global to local" (earlier elements weigh more), quote all text and
    # describe the typographic system, vector work needs graphic type + shape logic + a strict
    # colour system + line discipline and "Avoid texture or material-focused language", and
    # "Avoid stacking dramatic or evaluative adjectives". V4 takes up to 10,000 characters but no
    # negative prompt or curated style; colours go in as brand colors (a separate option).
    label: Recraft Design & Vector
    style: keywords
    max_words: 50
    prompt_guide: |
      Write from global to local: the format and the main subject first, then background, framing, secondary items, light.
      Name the graphic type directly: "flat vector icon", "poster", "packaging", "editorial illustration".
      Give a strict colour system (2 to 4 named colours) and say line weight and shapes for vector work.
      Put every word that must appear in "double quotes" and describe the type: headline size, place, hierarchy, alignment.
      For vector output use shape and colour words only. Do NOT use lens jargon, texture or material words.
      Avoid: stacked dramatic adjectives, negative phrases, brand names.
  ideogram:
    label: Ideogram
    style: sentences
    max_words: 50
    prompt_guide: |
      Write 1 or 3 sentences, subject first.
      Put the exact text that must appear in "double quotes" and say its style and place.
      Name the layout (poster, sign, label) when there is text.
      Avoid: long text blocks, many different texts in one image.
  sd:
    label: Stable Diffusion
    style: keywords
    max_words: 60
    prompt_guide: |
      Write comma-separated keywords, most important first.
      Order: subject, setting, light, camera, style, then a few quality words.
      A separate negative prompt is added by the system. Do not write one.
      Avoid: full sentences, "no ..." phrases.
  leonardo:
    label: Leonardo
    style: sentences
    max_words: 60
    prompt_guide: |
      Write 2 or 3 vivid natural sentences, subject first.
      Describe the light and the colors in words ("warm golden light, deep teal shadows").
      Good at creative scenes, characters and bold color. Phoenix is good at short text.
      Put any text that must appear in "double quotes".
      Avoid: keyword spam, "no ..." phrases, abstract mood words.

  # Provisional guides for families added with the OpenRouter list. Written from general
  # practice, not from each vendor's docs. Refine them after the first real runs.
  krea:
    label: Krea
    style: sentences
    max_words: 60
    prompt_guide: |
      Write 2 or 3 natural sentences, subject first.
      Name the light, the colors and the lens in plain words.
      Good at photoreal and art-directed images with a strong look.
      Keep every detail visible and concrete.
      Avoid: keyword spam, "no ..." phrases, abstract mood words.
  mai:
    label: Microsoft MAI
    style: sentences
    max_words: 50
    prompt_guide: |
      Write a short descriptive paragraph in natural sentences.
      Say who or what is in the scene, where it is, and the light.
      Describe the camera in words ("a wide shot at eye level").
      Put any text that must appear in "double quotes".
      Avoid: keyword lists and negative phrases.
  riverflow:
    label: Riverflow
    style: sentences
    max_words: 50
    prompt_guide: |
      Write 1 to 3 clear sentences, subject first.
      Add the setting, the light and the style in plain words.
      Keep it literal. One scene, no stacked adjectives.
      Put any text that must appear in "double quotes".
      Avoid: negative phrases and vague mood words.
  muse:
    label: Meta Muse
    style: sentences
    max_words: 50
    prompt_guide: |
      Write a short natural description, like a photo caption.
      Cover the subject, the setting, the light, the camera framing and the textures.
      Say the shot type in words ("a close-up in warm window light").
      Keep the scene to one clear idea.
      Avoid: keyword lists and "no ..." phrases.

