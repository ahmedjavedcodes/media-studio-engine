# Model cards (spec section 6). One model, many providers.
#
# `cost` is USD per image at 1K. These are ESTIMATES copied from each provider's pricing page.
# The daily sync (gateway/sync.py) and the billed cost after each call correct them.
# `tier` is computed from the cheapest provider cost. Never write it here.
#
# status: hidden -> testing -> live. A model goes live only after a real test:
# size, seed and the code guard work, and the critic scores a 10-prompt run.
# Verified live on 2026-11-25 (one real Cloudflare run each): flux-1-schnell, flux-2-klein-4b,
# flux-2-klein-9b, phoenix-1. Not yet run: lucid-origin.
# Per-family prompting guides (spec v1.2). The enhancer gets the chosen family's guide at the END
# of its system prompt. `style` is used by COMPILE_MODE=code. 5-8 lines each.
families:
  gpt_image:
    label: OpenAI GPT Image
    style: sentences
    max_words: 40
    prompt_guide: |
      Write 2 or 3 vivid sentences. Cover the subject, the light, the camera framing and the material textures.
      Name the subject first, then the setting. Say the shot in words ("a low-angle close-up").
      Put any text that must appear in "double quotes", and say where it sits.
      Be literal and concrete. One clear scene, no keyword lists.
      Avoid: stacked adjectives, vague mood words, brand or artist names.
  gemini:
    label: Google Nano Banana & Gemini
    style: sentences
    max_words: 50
    prompt_guide: |
      Write a short descriptive paragraph in natural sentences, like a photo caption.
      Cover who or what is in the scene, the setting, the light, the camera framing and the textures.
      Say the shot and the light in words ("a close-up portrait in warm window light").
      State the mood through visible things, not abstract words.
      Avoid: keyword lists, tag soup, negative phrases like "no blur".
  flux:
    label: FLUX
    style: keywords
    max_words: 60
    prompt_guide: |
      Write comma-separated visual phrases. The most important thing goes first.
      Order: subject, action, setting, lighting, camera or lens, style.
      Use concrete words ("shallow depth of field, 85mm", "rim light from the left").
      Keep it under the word limit. Do not repeat the same idea twice.
      Avoid: negative prompts and "no ..." phrases, quality spam like "masterpiece, 8k".
  seedream:
    label: ByteDance Seedream
    style: keywords
    max_words: 60
    prompt_guide: |
      Write one clear sentence or a short run of phrases, subject first.
      Add the setting, the light, the camera framing and the material textures in plain words.
      Works well for products, food and clean commercial scenes.
      Keep each detail concrete and visible.
      Avoid: abstract mood words, long stories, negative phrases.
  qwen:
    label: Qwen
    style: keywords
    max_words: 60
    prompt_guide: |
      Write short keyword phrases, subject first, then setting, light and style.
      Put any text that must appear in "double quotes" and say where it sits.
      Good at text in images and posters. Keep the text short.
      Avoid: long sentences, many competing subjects, vague words.
  recraft:
    label: Recraft Design & Vector
    style: keywords
    max_words: 30
    prompt_guide: |
      Design models. Keep the exact display copy in "double quotes" and say where it sits.
      Describe the layout and the typography placement: headline, subtitle, margins, alignment.
      Name the look directly: "flat vector", "brand colors navy and orange", "poster", "packaging".
      Keep it short. Do NOT use photographic lens jargon (no mm, f-stops or bokeh).
      Avoid: long scenes, negative phrases, brand names.
  ideogram:
    label: Ideogram
    style: sentences
    max_words: 50
    prompt_guide: |
      Write 1 or 3 sentences, subject first.
      Put the exact text that must appear in "double quotes" and say its style and place.
      Name the layout (poster, sign, label) when there is text.
      Avoid: long text blocks, many different texts in one image.
  sd:
    label: Stable Diffusion
    style: keywords
    max_words: 60
    prompt_guide: |
      Write comma-separated keywords, most important first.
      Order: subject, setting, light, camera, style, then a few quality words.
      A separate negative prompt is added by the system. Do not write one.
      Avoid: full sentences, "no ..." phrases.
  leonardo:
    label: Leonardo
    style: sentences
    max_words: 60
    prompt_guide: |
      Write 2 or 3 vivid natural sentences, subject first.
      Describe the light and the colors in words ("warm golden light, deep teal shadows").
      Good at creative scenes, characters and bold color. Phoenix is good at short text.
      Put any text that must appear in "double quotes".
      Avoid: keyword spam, "no ..." phrases, abstract mood words.

  # Provisional guides for families added with the OpenRouter list. Written from general
  # practice, not from each vendor's docs. Refine them after the first real runs.
  krea:
    label: Krea
    style: sentences
    max_words: 60
    prompt_guide: |
      Write 2 or 3 natural sentences, subject first.
      Name the light, the colors and the lens in plain words.
      Good at photoreal and art-directed images with a strong look.
      Keep every detail visible and concrete.
      Avoid: keyword spam, "no ..." phrases, abstract mood words.
  mai:
    label: Microsoft MAI
    style: sentences
    max_words: 50
    prompt_guide: |
      Write a short descriptive paragraph in natural sentences.
      Say who or what is in the scene, where it is, and the light.
      Describe the camera in words ("a wide shot at eye level").
      Put any text that must appear in "double quotes".
      Avoid: keyword lists and negative phrases.
  riverflow:
    label: Riverflow
    style: sentences
    max_words: 50
    prompt_guide: |
      Write 1 to 3 clear sentences, subject first.
      Add the setting, the light and the style in plain words.
      Keep it literal. One scene, no stacked adjectives.
      Put any text that must appear in "double quotes".
      Avoid: negative phrases and vague mood words.
  muse:
    label: Meta Muse
    style: sentences
    max_words: 50
    prompt_guide: |
      Write a short natural description, like a photo caption.
      Cover the subject, the setting, the light, the camera framing and the textures.
      Say the shot type in words ("a close-up in warm window light").
      Keep the scene to one clear idea.
      Avoid: keyword lists and "no ..." phrases.

