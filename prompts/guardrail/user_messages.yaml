# Every text the user sees from the guardrail. Never show model reasons, scores or thresholds.
# `tip: null` = no tip.
# Placeholders: {n} strike number · {limit} strike limit · {wait} human text built in code
# ("1 minute", "2 minutes", "30 minutes").

categories:
  CSAM:
    message: Your request may involve a minor in sexual or suggestive content.
    tip: null
  NCII_UNDRESSING:
    message: Your request asks to undress a real person or put their face on an explicit body.
    tip: Edit the background, style or lighting instead.
  GORE_SELF_HARM:
    message: Your request involves graphic gore, self-harm or cruelty.
    tip: Try an action scene without gore.
  TERRORISM_WEAPONS:
    message: Your request involves making real weapons or terror attacks.
    tip: Sci-fi and fantasy weapons are fine.
  NSFW_EXPLICIT:
    message: Your request asks for nudity or sexual content.
    tip: Try a fully clothed version.
  CELEBRITY_LIKENESS:
    message: Your request involves a real public figure.
    tip: Try a fictional or AI-made person.
  HATE_HARASSMENT:
    message: Your request contains hateful or harassing content.
    tip: null
  PROMPT_INJECTION:
    message: Your request tries to change the system's rules.
    tip: Describe only the image you want.
  PII_WATERMARK:
    message: Your request involves ID cards, bank cards, official documents or removing a watermark.
    tip: Use your own photo or a plain mockup.
  OTHER_UNSAFE:
    message: Your request may break our content policy.
    tip: Try rewording your prompt.

strike_warning: "Strike {n} of {limit}. At {limit} strikes your account will be banned."
strike_banned: "Strike {n} of {limit}. Your account has been banned."
retry_text: "You can try again in {wait}."
report_link: "Think this is a mistake? Report it."

# Non-reject responses (400, 403, 429, 503)
bad_input: "We could not read your prompt or image. Check the file type and size, then try again."
account_restricted: "Your account is restricted. Contact support if you think this is a mistake."
cooldown: "Too many blocked requests. You can try again in {wait}."
unavailable: "Safety verification timed out. Please try again."